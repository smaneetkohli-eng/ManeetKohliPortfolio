<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Maneet Kohli</title>
    <meta name="description" content="Maneet Kohli. AI-focused. Data-driven. Business-minded." />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,900&family=Inter:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="css/site.css?v=7" />
  </head>
  <body>
    <main class="hero" id="hero">
      <!-- Paper Shaders GrainGradient (shape: wave) mounts a <canvas> in here. -->
      <div class="hero__wave" id="hero-wave" aria-hidden="true"></div>

      <h1 class="hero__name">
        <span class="hero__name-word hero__name-word--first">Maneet</span>
        <span class="hero__name-word hero__name-word--last">Kohli</span>
      </h1>

      <img
        class="hero__figure"
        src="images/hero-figure.png"
        alt="Maneet Kohli"
        fetchpriority="high"
        decoding="async"
      />
    </main>

    <!-- Progressive blur pinned to the bottom edge of the viewport. -->
    <div class="edge-blur" aria-hidden="true">
      <div class="edge-blur__layer"></div>
      <div class="edge-blur__layer"></div>
      <div class="edge-blur__layer"></div>
      <div class="edge-blur__layer"></div>
      <div class="edge-blur__layer"></div>
      <div class="edge-blur__layer"></div>
      <div class="edge-blur__layer"></div>
      <div class="edge-blur__layer"></div>
    </div>

    <nav class="dock" aria-label="Primary">
      <a class="dock__sig" href="#hero" aria-label="Maneet Kohli">
        <img
          class="dock__sig-img"
          src="images/signature.png"
          alt=""
          onerror="this.closest('.dock__sig').classList.add('dock__sig--fallback')"
        />
        <span class="dock__sig-fallback" aria-hidden="true">MK</span>
      </a>

      <ul class="dock__links">
        <li><a class="dock__link" href="#"><span class="dock__link-label">Home</span></a></li>
        <li><a class="dock__link" href="#"><span class="dock__link-label">About</span></a></li>
        <li><a class="dock__link" href="#"><span class="dock__link-label">Projects</span></a></li>
        <li><a class="dock__link" href="#"><span class="dock__link-label">Journal</span></a></li>
      </ul>

      <a class="dock__cta" href="#">
        <span>Contact</span>
        <span class="dock__cta-plus" aria-hidden="true">+</span>
      </a>
    </nav>

    <script type="module" src="js/site.js?v=1"></script>
  </body>
</html>
