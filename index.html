<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Maneet Kohli</title>
    <meta name="description" content="Maneet Kohli. AI-focused. Data-driven. Business-minded." />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,900&family=Inter:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="css/site.css?v=10" />
  </head>
  <body>
    <main class="hero" id="hero">
      <!-- Paper Shaders GrainGradient (shape: wave) mounts a <canvas> in here. -->
      <div class="hero__wave" id="hero-wave" aria-hidden="true"></div>

      <h1 class="hero__name">
        <span class="hero__name-word hero__name-word--first">
          <span class="hero__name-inner">
            <span class="hero__meta hero__meta--left">
              <span class="shimmer shimmer--ltr" data-text="Business Analytics and Artificial Intelligence">Business Analytics and Artificial Intelligence</span>
            </span>
            Maneet
          </span>
        </span>
        <span class="hero__name-word hero__name-word--last">
          <span class="hero__name-inner">
            Kohli
            <span class="hero__meta hero__meta--right">
              <span class="hero__meta-icon" id="meta-icon" aria-hidden="true"></span>
              <span class="shimmer shimmer--rtl" id="meta-time" data-text="Texas, United States">Texas, United States</span>
            </span>
          </span>
        </span>
      </h1>

      <img
        class="hero__figure"
        src="images/hero-figure.png"
        alt="Maneet Kohli"
        fetchpriority="high"
        decoding="async"
      />
    </main>

    <!-- Sits above the edge blur so it stays crisp: cycling line + scroll prompt on the torso. -->
    <div class="hero-status">
      <div class="cycle" id="cycle">
        <span class="cycle__word is-active">Data driven</span>
        <span class="cycle__word">AI focused</span>
        <span class="cycle__word">Business minded</span>
      </div>
      <a class="scroll-prompt" href="#hero">
        <span class="shimmer shimmer--ttb" data-text="Scroll to explore">Scroll to explore</span>
        <svg class="scroll-prompt__arrow" viewBox="0 0 7.824 9.941" aria-hidden="true">
          <path d="M 4.366 9.744 C 4.103 10.006 3.677 10.006 3.414 9.744 L 0.175 6.505 C -0.067 6.238 -0.057 5.829 0.198 5.574 C 0.452 5.32 0.862 5.31 1.128 5.553 L 3.217 7.642 L 3.217 0.696 C 3.209 0.45 3.335 0.219 3.547 0.094 C 3.758 -0.031 4.021 -0.031 4.233 0.094 C 4.444 0.219 4.571 0.45 4.563 0.696 L 4.563 7.641 L 6.652 5.552 C 6.819 5.368 7.074 5.291 7.314 5.352 C 7.555 5.413 7.743 5.601 7.804 5.842 C 7.864 6.083 7.787 6.337 7.603 6.505 L 4.366 9.743 Z" fill="currentColor" />
        </svg>
      </a>
    </div>

    <!-- Progressive blur pinned to the bottom edge of the viewport. -->
    <div class="edge-blur" aria-hidden="true">
      <div class="edge-blur__layer"></div>
      <div class="edge-blur__layer"></div>
      <div class="edge-blur__layer"></div>
      <div class="edge-blur__layer"></div>
      <div class="edge-blur__layer"></div>
      <div class="edge-blur__layer"></div>
      <div class="edge-blur__layer"></div>
      <div class="edge-blur__layer"></div>
    </div>

    <nav class="dock" aria-label="Primary">
      <a class="dock__sig" href="#hero" aria-label="Maneet Kohli">
        <img
          class="dock__sig-img"
          src="images/signature.png"
          alt=""
          onerror="this.closest('.dock__sig').classList.add('dock__sig--fallback')"
        />
        <span class="dock__sig-fallback" aria-hidden="true">MK</span>
      </a>

      <ul class="dock__links">
        <li><a class="dock__link" href="#"><span class="dock__link-label">Home</span></a></li>
        <li><a class="dock__link" href="#"><span class="dock__link-label">About</span></a></li>
        <li><a class="dock__link" href="#"><span class="dock__link-label">Projects</span></a></li>
        <li><a class="dock__link" href="#"><span class="dock__link-label">Journal</span></a></li>
      </ul>

      <a class="dock__cta" href="#">
        <span>Contact</span>
        <span class="dock__cta-plus" aria-hidden="true">+</span>
      </a>
    </nav>

    <div class="cursor" id="cursor" aria-hidden="true"></div>

    <script type="module" src="js/site.js?v=2"></script>
  </body>
</html>
